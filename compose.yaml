name: p27-local
services:
  db:
    image: postgres@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: p27_admin
      POSTGRES_PASSWORD: p27-local-admin
      POSTGRES_DB: p27
    ports: ["127.0.0.1:5527:5432"]
    volumes: ["db:/var/lib/postgresql", "./migrations:/docker-entrypoint-initdb.d:ro"]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p27_admin -d p27"]
      interval: 1s
      timeout: 2s
      retries: 30
  tooling:
    image: golang@sha256:d9b6a1beb9474adc2a1ce842573639b44b2a0dd49b6669f51d3821baf9ec37c9
    command: ["sleep", "infinity"]
    working_dir: /workspace
    volumes: [".:/workspace", "gomod:/go/pkg/mod", "gocache:/root/.cache/go-build"]
    environment:
      GOTOOLCHAIN: local
      P27_TEST_DSN: postgres://p27_admin:p27-local-admin@db:5432/p27?sslmode=disable
      P27_WORKER_DSN: postgres://p27_worker:p27-local-worker@db:5432/p27?sslmode=disable
      P27_RECEIVER_DSN: postgres://p27_receiver:p27-local-receiver@db:5432/p27?sslmode=disable
    mem_limit: 2g
    cpus: 2
    depends_on:
      db: {condition: service_healthy}
volumes:
  db:
  gomod:
  gocache:
